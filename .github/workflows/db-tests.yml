name: Database Tests

on:
  push:
  pull_request:

jobs:
  db-tests:
    name: Supabase DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Prepare logs directory
        run: mkdir -p logs

      - name: Start Supabase stack
        run: |
          set -o pipefail
          supabase start 2>&1 \
            | sed -E 's/sb_secret_[A-Za-z0-9_=.-]+/[redacted-secret-key]/g; s/sb_publishable_[A-Za-z0-9_=.-]+/[redacted-publishable-key]/g; s/(Publishable[[:space:]]+)[^[:space:]]+/\1[redacted]/g; s/(Secret[[:space:]]+)[^[:space:]]+/\1[redacted]/g; s/(service_role key[[:space:]]+)[^[:space:]]+/\1[redacted]/Ig; s/(anon key[[:space:]]+)[^[:space:]]+/\1[redacted]/Ig' \
            | tee logs/supabase-start.log

      - name: Reset database
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee logs/supabase-db-reset.log

      - name: Run pgTAP database tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee logs/supabase-test-db.log

      - name: Print pgTAP summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path("logs/supabase-test-db.log")
          text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          plan_total = 0
          passed = 0
          failed = 0

          for line in text.splitlines():
              stripped = line.strip()
              if re.match(r"^1\.\.\d+$", stripped):
                  plan_total = max(plan_total, int(stripped.split("..", 1)[1]))
              if re.match(r"^ok\b", stripped):
                  passed += 1
              if re.match(r"^not ok\b", stripped):
                  failed += 1

          if not text:
              print("pgTAP summary: no supabase test db output was produced.")
          else:
              print(f"pgTAP summary: tests={plan_total or passed + failed}, passed={passed}, failed={failed}")
          PY

      - name: Print diagnostic log tails
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          def escape_annotation(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          def redact(value: str) -> str:
              value = re.sub(r"sb_secret_[A-Za-z0-9_=.-]+", "[redacted-secret-key]", value)
              value = re.sub(r"sb_publishable_[A-Za-z0-9_=.-]+", "[redacted-publishable-key]", value)
              value = re.sub(r"(service_role key\s+)\S+", r"\1[redacted]", value, flags=re.IGNORECASE)
              value = re.sub(r"(anon key\s+)\S+", r"\1[redacted]", value, flags=re.IGNORECASE)
              return value

          files = (
              "logs/supabase-start.log",
              "logs/supabase-db-reset.log",
              "logs/supabase-test-db.log",
          )

          summary_parts = ["## Supabase DB test diagnostics", ""]

          for file_name in files:
              path = Path(file_name)
              summary_parts.append(f"### {file_name}")
              if not path.exists():
                  summary_parts.append("No output file was produced.")
                  summary_parts.append("")
                  continue
              tail = redact("\n".join(path.read_text(encoding="utf-8", errors="replace").splitlines()[-80:]))
              if tail:
                  print(f"::warning title={escape_annotation(file_name)} tail::{escape_annotation(tail)}")
              summary_parts.extend(["```text", tail, "```", ""])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              Path(summary_path).write_text("\n".join(summary_parts), encoding="utf-8")
          PY

      - name: Redact logs before artifact upload
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def redact(value: str) -> str:
              value = re.sub(r"sb_secret_[A-Za-z0-9_=.-]+", "[redacted-secret-key]", value)
              value = re.sub(r"sb_publishable_[A-Za-z0-9_=.-]+", "[redacted-publishable-key]", value)
              value = re.sub(r"(service_role key\s+)\S+", r"\1[redacted]", value, flags=re.IGNORECASE)
              value = re.sub(r"(anon key\s+)\S+", r"\1[redacted]", value, flags=re.IGNORECASE)
              return value

          for path in Path("logs").glob("*.log"):
              text = path.read_text(encoding="utf-8", errors="replace")
              path.write_text(redact(text), encoding="utf-8")
          PY

      - name: Upload Supabase DB test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-test-output
          path: logs/
          if-no-files-found: error

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
