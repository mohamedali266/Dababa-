name: Database Tests

on:
  push:
  pull_request:

jobs:
  db-tests:
    name: Supabase DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DISABLE_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Prepare logs directory
        run: mkdir -p logs

      - name: Start Supabase stack
        run: |
          set -o pipefail
          supabase start 2>&1 \
            | sed -E 's/sb_secret_[A-Za-z0-9_=.-]+/[redacted-secret-key]/g; s/sb_publishable_[A-Za-z0-9_=.-]+/[redacted-publishable-key]/g; s/(Publishable[[:space:]]+)[^[:space:]]+/\1[redacted]/g; s/(Secret[[:space:]]+)[^[:space:]]+/\1[redacted]/g; s/(service_role key[[:space:]]+)[^[:space:]]+/\1[redacted]/Ig; s/(anon key[[:space:]]+)[^[:space:]]+/\1[redacted]/Ig' \
            | tee logs/supabase-start.log

      - name: Reset database
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee logs/supabase-db-reset.log

      - name: Run pgTAP database tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee logs/supabase-test-db.log

      - name: Print pgTAP summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          log_path = Path("logs/supabase-test-db.log")
          text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.exists() else ""
          plan_total = 0
          passed = 0
          failed = 0

          for line in text.splitlines():
              stripped = line.strip()
              if re.match(r"^1\.\.\d+$", stripped):
                  plan_total = max(plan_total, int(stripped.split("..", 1)[1]))
              if re.match(r"^ok\b", stripped):
                  passed += 1
              if re.match(r"^not ok\b", stripped):
                  failed += 1

          if not text:
              print("pgTAP summary: no supabase test db output was produced.")
          else:
              print(f"pgTAP summary: tests={plan_total or passed + failed}, passed={passed}, failed={failed}")
          PY

      - name: Print diagnostic log tails
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def escape_annotation(value: str) -> str:
              return (
                  value.replace("%", "%25")
                  .replace("\r", "%0D")
                  .replace("\n", "%0A")
                  .replace(":", "%3A")
                  .replace(",", "%2C")
              )

          for file_name in (
              "logs/supabase-start.log",
              "logs/supabase-db-reset.log",
              "logs/supabase-test-db.log",
          ):
              path = Path(file_name)
              if not path.exists():
                  continue
              tail = "\n".join(path.read_text(encoding="utf-8", errors="replace").splitlines()[-80:])
              tail = re.sub(r"sb_secret_[A-Za-z0-9_=.-]+", "[redacted-secret-key]", tail)
              tail = re.sub(r"sb_publishable_[A-Za-z0-9_=.-]+", "[redacted-publishable-key]", tail)
              if tail:
                  print(f"::warning title={escape_annotation(file_name)} tail::{escape_annotation(tail)}")
          PY

          {
            echo "## Supabase DB test diagnostics"
            echo
            for file in logs/supabase-start.log logs/supabase-db-reset.log logs/supabase-test-db.log; do
              echo "### ${file}"
              if [ -f "${file}" ]; then
                echo '```text'
                tail -n 160 "${file}"
                echo '```'
              else
                echo "No output file was produced."
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload Supabase DB test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-test-output
          path: logs/
          if-no-files-found: error

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
